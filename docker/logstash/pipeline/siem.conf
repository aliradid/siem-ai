# Logstash pipeline for the SIEM stack.
# Inputs are Kafka (critical_logs / network_logs / app_logs) and the HTTP
# port on 8080 used by the benchmark. Every event gets scored by the
# Flask ML service, then indexed into Elasticsearch. Anything that isn't
# benign also goes into an alerts index.

input {
  http {
    port => 8080
    codec => "json"
    tags => ["http_ingest"]
  }
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["critical_logs", "network_logs", "app_logs"]
    codec => "json"
    group_id => "logstash-siemai"
    tags => ["kafka_ingest"]
  }
}

filter {
  # benchmark reads this to measure end-to-end latency
  ruby {
    code => "event.set('ingest_ts_ms', (Time.now.to_f * 1000).to_i)"
  }

  # only call /predict on events that ship a `features` array
  if [features] {
    http {
      url => "http://ml-inference:5000/predict"
      verb => "POST"
      body_format => "json"
      body => { "features" => "%{[features]}" }
      target_body => "ml_response"
    }

    if [ml_response] {
      mutate {
        add_field => {
          "ml_label" => "%{[ml_response][label]}"
          "ml_score" => "%{[ml_response][score]}"
        }
      }
    } else {
      # /predict failed (network, scaler missing, exception): tag the event so
      # failed inferences are visible instead of silently unlabelled. The
      # error label still trips the alerts-index condition below, ensuring
      # operators see them rather than losing them in the main events index.
      mutate {
        add_field => { "ml_label" => "error" }
        add_tag => ["ml_inference_failed"]
      }
    }
  }

  # stamp the time inference finishes too, for the latency calc
  ruby {
    code => "event.set('infer_ts_ms', (Time.now.to_f * 1000).to_i)"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "siemai-events-v2-%{+YYYY.MM.dd}"
  }

  if [ml_label] and [ml_label] != "benign" and [ml_label] != "0" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "siemai-events-v2-alerts-%{+YYYY.MM.dd}"
    }
  }
}
