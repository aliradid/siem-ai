# Streaming stack: Zookeeper, Kafka, Elasticsearch, Kibana, Logstash,
# the Flask ML inference service, and Prometheus. Wazuh runs separately
# (see docker/wazuh-compose.yml) because its single-node setup ships
# its own compose file.
#
# Up: `docker compose up -d` from this directory.
# Needs roughly 12 GB. Drop ES_JAVA_OPTS / LS_JAVA_OPTS if you have less.

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: siemai-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [siemai]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: siemai-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [siemai]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: siemai-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [siemai]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: siemai-kibana
    depends_on: [elasticsearch]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks: [siemai]

  ml-inference:
    build:
      context: ../inference
      dockerfile: Dockerfile
    container_name: siemai-ml
    ports:
      - "5001:5000"   # host 5001 -> container 5000 (macOS AirPlay grabs 5000)
    volumes:
      - ../results:/app/models:ro
    environment:
      - MODEL_PATH=/app/models/nsl_kdd_xgb.joblib
    networks: [siemai]
    # bump this if you swap in the HDFS model:
    # mem_limit: 4g

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: siemai-logstash
    depends_on: [elasticsearch, kafka, ml-inference]
    environment:
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "5044:5044"   # Beats input
      - "8080:8080"   # HTTP input for benchmark
      - "9600:9600"   # monitoring API
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    networks: [siemai]

  prometheus:
    image: prom/prometheus:latest
    container_name: siemai-prom
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [siemai]

networks:
  siemai:
    driver: bridge

volumes:
  es-data:
