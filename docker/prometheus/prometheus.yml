global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: logstash
    metrics_path: /_node/stats
    static_configs:
      - targets: ['logstash:9600']

  - job_name: elasticsearch
    metrics_path: /
    static_configs:
      - targets: ['elasticsearch:9200']

  - job_name: ml-inference
    static_configs:
      - targets: ['ml-inference:5000']
